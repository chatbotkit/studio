name: Release
# VERSION owns the version. A push to main whose VERSION has no tag yet is a
# release request: this workflow tests, builds, records the tag and publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Serialize releases so a later push plans against the tags of an earlier one.
concurrency:
  group: studio-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests are validated too: a new VERSION must arrive with dated notes.
      - id: plan
        run: bash scripts/release-version.sh plan
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.plan.outputs.release }}
          RESUME: ${{ steps.plan.outputs.resume }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ "$RELEASE" == true ]]; then
              publish=true
            elif [[ "$RESUME" == true ]]; then
              # This commit is tagged. Finish it only if nothing was published.
              draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
              if [[ "$draft" != false ]]; then publish=true; fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/ModuleCache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release branch
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          bash scripts/release-notes.sh "$version" > "$RUNNER_TEMP/studio-release-notes.md"
          echo "STUDIO_VERSION=$version" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          git lfs fsck
      - name: Run regression tests
        run: |
          bash scripts/test-release-notes.sh
          bash scripts/test-release-version.sh
          swift test -c release
      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE_P12:?Missing certificate secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password secret}"
          : "${APP_STORE_CONNECT_API_KEY_P8:?Missing notarization key secret}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing notarization key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing notarization issuer ID}"
          keychain="$RUNNER_TEMP/studio-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/studio-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/studio-signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ {print $2; exit}')"
          test -n "$identity"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/studio-notary.p8"
          echo "STUDIO_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/studio-notary.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Prepare update-signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${SPARKLE_PRIVATE_KEY:?Missing Studio update-signing key}"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/studio-update.key"
          echo "SPARKLE_PRIVATE_KEY_PATH=$RUNNER_TEMP/studio-update.key" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and package
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: scripts/package-release.sh "$RELEASE_TAG"
      # Only a tested, signed and notarized build earns the tag. A tag pushed
      # with this token starts no other workflow.
      - name: Record the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch origin --tags
          bash scripts/release-version.sh tag
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # A draft left by an interrupted attempt is rebuilt from this run's assets.
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Studio-$STUDIO_VERSION-macOS-arm64.zip" \
            "dist/Studio-$STUDIO_VERSION-macOS-arm64.zip.sha256" \
            "dist/appcast.xml" \
            --draft --verify-tag --notes-file "$RUNNER_TEMP/studio-release-notes.md" --title "Studio $STUDIO_VERSION"
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/studio-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/studio-signing.p12" "$RUNNER_TEMP/studio-notary.p8" "$RUNNER_TEMP/studio-update.key"
