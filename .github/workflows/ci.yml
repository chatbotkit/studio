name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ModuleCache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/ModuleCache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - name: Check toolchain and LFS assets
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          git lfs fsck
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run regression tests
        run: |
          bash scripts/test-release-notes.sh
          swift scripts/verify-web-transport.swift --self-test
          swift test -c release
      - name: Build and verify sandboxed app
        run: scripts/build-app.sh
      - name: Package inspection build (not runnable without team signing)
        run: ditto -c -k --sequesterRsrc --keepParent dist/Studio.app dist/Studio-development-macOS-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Studio-packaging-inspection-macOS-arm64
          path: dist/Studio-development-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
